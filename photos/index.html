<style>
*,*::before,*::after{box-sizing:border-box; margin:0; padding:0}
body{color:var(--ab-cream); font-family:'Observer Text',Georgia,serif; min-height:100vh}
a{color:inherit}
.wrap{max-width:1120px; margin:0 auto; padding:56px 16px 72px}
.hd{text-align:center; margin-bottom:56px}
.logo{display:inline-block; color:var(--ab-cream); margin-bottom:26px; transition:opacity .2s}
.logo:hover{opacity:.75}
h1{font-family:var(--ab-sharp); font-weight:normal; font-size:clamp(28px,5.4vw,48px);
  letter-spacing:.16em; text-indent:.16em; line-height:1}
.set{margin-bottom:64px}
.set-hd{text-align:center; margin-bottom:22px}
/* the set's name reversed out of a cream label, as on the covers */
.set-hd h2{display:inline-block; background:var(--ab-cream); color:var(--ab-green); font-family:var(--ab-book);
  font-weight:normal; font-size:12px; letter-spacing:.32em; text-indent:.32em; text-transform:uppercase;
  line-height:1; padding:9px 16px 8px}
.set-hd p{font-family:'Observer Text',Georgia,serif; font-style:italic;
  font-size:13px; color:var(--ab-cream-dim); margin-top:12px; letter-spacing:.03em}
.hero{display:block; margin-bottom:6px; cursor:zoom-in}
.hero img{display:block; width:100%; height:auto; background:var(--ab-green-deep)}
/* justified rows: every photo keeps its shape, rows fill the width, nothing is cropped */
.grid{--rowh:230px; display:flex; flex-wrap:wrap; gap:6px}
.grid::after{content:''; flex-grow:1000000}
.ph{display:block; flex-grow:calc(var(--ar) * 100); width:calc(var(--ar) * var(--rowh)); cursor:zoom-in}
.ph img{display:block; width:100%; height:auto; aspect-ratio:var(--ar); background:var(--ab-green-deep);
  transition:opacity .2s}
.ph:hover img,.hero:hover img{opacity:.88}
.ft{text-align:center; font-family:var(--ab-book); font-size:12px; letter-spacing:.24em; text-transform:uppercase}
.ft a{text-decoration:none; color:var(--ab-cream-dim)}
.ft a:hover{color:var(--ab-cream)}
@media (max-width:640px){ .wrap{padding-top:40px} .grid{--rowh:140px; gap:4px} .hd{margin-bottom:40px} }

/* the viewer */
.lb{position:fixed; inset:0; z-index:50; background:rgba(26,32,22,.97); display:flex; align-items:center;
  justify-content:center; touch-action:pan-y}
.lb[hidden]{display:none}
.lb img{max-width:calc(100vw - 150px); max-height:calc(100vh - 96px); width:auto; height:auto; display:block;
  box-shadow:0 10px 40px rgba(0,0,0,.4); user-select:none; -webkit-user-drag:none}
.lb button{position:absolute; background:none; border:0; color:var(--ab-cream); cursor:pointer; padding:14px;
  opacity:.8; transition:opacity .15s}
.lb button:hover{opacity:1}
.lb .prev{left:4px; top:50%; transform:translateY(-50%)}
.lb .next{right:4px; top:50%; transform:translateY(-50%)}
.lb .close{right:8px; top:8px}
.lb svg{display:block; stroke:currentColor; stroke-width:1.6; fill:none}
.lb .count{position:absolute; bottom:18px; left:0; right:0; text-align:center; font-family:var(--ab-book);
  font-size:12px; letter-spacing:.24em; color:var(--ab-cream-dim)}
@media (max-width:640px){ .lb .prev,.lb .next{display:none} .lb img{max-width:100vw; max-height:calc(100vh - 80px)} }
</style>
</head>
<body>

<div class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
<img alt="">
<button class="prev" aria-label="Previous photo"><svg width="26" height="44" viewBox="0 0 26 44"><path d="M22 4 L4 22 L22 40"/></svg></button>
<button class="next" aria-label="Next photo"><svg width="26" height="44" viewBox="0 0 26 44"><path d="M4 4 L22 22 L4 40"/></svg></button>
<button class="close" aria-label="Close"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 3 L21 21 M21 3 L3 21"/></svg></button>
<div class="count"></div>
</div>
<script>
(function(){
  var lb = document.querySelector('.lb'), img = lb.querySelector('img'), count = lb.querySelector('.count');
  var links = Array.prototype.slice.call(document.querySelectorAll('[data-i]')), at = -1, pushed = false;
  function show(i){
    at = (i + links.length) % links.length;
    var a = links[at];
    img.src = a.getAttribute('href');
    img.alt = a.querySelector('img').alt;
    count.textContent = (at + 1) + ' / ' + links.length;
    [at - 1, at + 1].forEach(function(k){ new Image().src = links[(k + links.length) % links.length].getAttribute('href'); });
  }
  function open(i){
    show(i); lb.hidden = false; document.body.style.overflow = 'hidden';
    if(!pushed){ history.pushState({photo:1}, ''); pushed = true; }   /* the back button closes the viewer */
    lb.querySelector('.close').focus();
  }
  function shut(){
    if(lb.hidden) return;
    lb.hidden = true; document.body.style.overflow = ''; img.removeAttribute('src');
    if(links[at]) links[at].focus();
  }
  function close(){ if(pushed){ history.back(); } else { shut(); } }
  window.addEventListener('popstate', function(){ pushed = false; shut(); });
  links.forEach(function(a, i){
    a.addEventListener('click', function(e){ e.preventDefault(); open(i); });
  });
  lb.querySelector('.prev').addEventListener('click', function(){ show(at - 1); });
  lb.querySelector('.next').addEventListener('click', function(){ show(at + 1); });
  lb.querySelector('.close').addEventListener('click', close);
  lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
  document.addEventListener('keydown', function(e){
    if(lb.hidden) return;
    if(e.key === 'ArrowLeft') show(at - 1);
    else if(e.key === 'ArrowRight') show(at + 1);
    else if(e.key === 'Escape') close();
  });
  var x0 = null;   /* swipe on phones */
  lb.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) > 50) show(at + (dx < 0 ? 1 : -1));
  });
})();
</script>
